<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AURION — Administration</title><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><header><a href="/">AURION</a><span>STUDIO / ADMINISTRATION</span><button id="logout" hidden>Abmelden</button></header><main><div id="notice" role="status"></div><section id="login"><span class="eyebrow">GESCHÜTZTER BEREICH</span><h1>Willkommen im Studio.</h1><p>Verwalte deine Kollektion, Drops und Angebote.</p><form id="login-form"><label>Benutzername<input name="username" autocomplete="username" value="admin" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">Anmelden →</button></form><a href="/">Zur Website</a></section><section id="dashboard" hidden><div class="heading"><div><span class="eyebrow">DEINE KOLLEKTION</span><h1>Alles unter deiner Kontrolle.</h1></div><a href="/" target="_blank" rel="noopener">Shop ansehen ↗</a></div><div class="stats" id="stats"></div><nav aria-label="Verwaltung"><button data-tab="products" aria-pressed="true">Artikel</button><button data-tab="drops" aria-pressed="false">Drops</button><button data-tab="offers" aria-pressed="false">Angebote</button></nav><div class="heading"><h2 id="list-title">Artikel</h2><button id="add">+ Hinzufügen</button></div><div id="items"></div></section></main><dialog id="editor"><button id="close-editor" aria-label="Schließen">×</button><h2 id="editor-title"></h2><form id="editor-form"><div id="fields"></div><div class="actions"><button type="button" id="cancel">Abbrechen</button><button type="submit">Speichern</button></div><p id="editor-error" role="alert"></p></form></dialog></body></html>
